<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 플래너</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:14px;color:#242424;background:#f3f2f1;height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;border:1px solid #d1d1d1;border-radius:4px;padding:5px 8px;background:#fff;color:#242424}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f6cbd;box-shadow:0 0 0 1px #0f6cbd}
#app{display:flex;height:100vh}
/* nav */
#nav{width:236px;background:#fafafa;border-right:1px solid #e1dfdd;display:flex;flex-direction:column;padding:10px 8px;flex-shrink:0}
.brand{font-weight:700;font-size:16px;padding:6px 10px 14px;color:#0f6cbd}
.nav-item{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:#edebe9}
.nav-item.active{background:#deecf9;font-weight:600}
.nav-sec{display:flex;justify-content:space-between;align-items:center;padding:14px 10px 4px;font-size:12px;color:#605e5c;font-weight:600}
.plans{overflow-y:auto;flex:1}
.nav-bottom{border-top:1px solid #e1dfdd;padding-top:6px;font-size:13px}
.status{padding:8px 10px 4px;font-size:12px;color:#605e5c;line-height:1.5;word-break:break-all}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#107c10}
.status.saving .dot{background:#ffaa44}.status.err .dot{background:#d13438}.status.local .dot{background:#8a8886}
.status.err{color:#a4262c}
.pdot{width:24px;height:24px;border-radius:5px;color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}
.pdot.big{width:34px;height:34px;font-size:15px;border-radius:7px}
.av{width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600;border:2px solid #fff}
.av.sm{width:22px;height:22px;font-size:10px}
.avs{display:flex}.avs .av{margin-left:-6px}.avs .av:first-child{margin-left:0}
/* header */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.ph{background:#fff;border-bottom:1px solid #e1dfdd;padding:10px 18px 0;position:relative}
.ph-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ptitle{font-size:18px;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:4px}
.ptitle:hover{background:#f3f2f1}
.tabs{display:flex;gap:2px;margin-left:10px;align-self:flex-end}
.tab{padding:10px 12px 9px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;color:#424242}
.tab:hover{color:#0f6cbd}
.tab.active{border-color:#0f6cbd;font-weight:600;color:#0f6cbd}
.ph-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:4px 0 8px}
.search{width:190px}
.btn{border:1px solid #d1d1d1;background:#fff;border-radius:4px;padding:5px 12px;white-space:nowrap}
.btn:hover{background:#f3f2f1}
.btn.primary{background:#0f6cbd;color:#fff;border-color:#0f6cbd}
.btn.primary:hover{background:#115ea3}
.btn.on{background:#deecf9;border-color:#0f6cbd;color:#0f6cbd}
.btn.danger{color:#a4262c}
.ib{border:none;background:transparent;border-radius:4px;padding:2px 7px;color:#605e5c;font-size:15px;line-height:1.4}
.ib:hover{background:#e1dfdd;color:#242424}
.gb{display:flex;align-items:center;gap:6px;font-size:13px;color:#605e5c}
/* filter */
.fpanel{position:absolute;right:18px;top:100%;z-index:30;background:#fff;border:1px solid #e1dfdd;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:12px 14px;width:300px;max-height:70vh;overflow:auto}
.fsec{margin-bottom:10px}.fsec h4{margin:0 0 6px;font-size:12px;color:#605e5c}
.fopt{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
/* board */
#content{flex:1;overflow:auto;min-height:0}
#content.noscroll{overflow:hidden}
.board{display:flex;gap:14px;padding:14px 18px 0;height:100%;overflow-x:auto;align-items:flex-start}
.col{width:282px;flex-shrink:0;display:flex;flex-direction:column;max-height:100%;border-radius:8px}
.col.bover{box-shadow:-4px 0 0 #0f6cbd}
.col.bover-r{box-shadow:4px 0 0 #0f6cbd}
.col-h{display:flex;align-items:center;gap:6px;padding:6px 4px 8px;font-weight:600;min-height:36px}
.col-h[draggable=true]{cursor:grab}
.col-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{color:#8a8886;font-weight:400;font-size:12px}
.col-h .ib{margin-left:auto}
.addt{border:none;background:#fff;border-radius:6px;padding:8px 10px;text-align:left;color:#0f6cbd;box-shadow:0 1px 2px rgba(0,0,0,.12);margin:0 2px 8px}
.addt:hover{background:#f8f8f8}
.cards{overflow-y:auto;min-height:60px;padding:2px 2px 40px;flex:1}
.card{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.14);padding:10px 12px 8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;position:relative}
.card:hover{box-shadow:0 3px 8px rgba(0,0,0,.18)}
.card.sel{border-color:#0f6cbd}
.card.dragging{opacity:.35}
.dropph{height:6px;background:#0f6cbd;border-radius:3px;margin:2px 0 8px}
.ct{font-weight:500;line-height:1.4;word-break:break-word;margin-bottom:6px}
.lbls{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.lchip{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.cmeta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#605e5c;align-items:center}
.cmeta .late{background:#fde7e9;color:#a4262c;padding:1px 6px;border-radius:4px;font-weight:600}
.cmeta .soon{color:#8a5a00;font-weight:600}
.cfoot{display:flex;align-items:center;margin-top:6px;min-height:22px}
.cfoot .ib{visibility:hidden}
.card:hover .cfoot .ib{visibility:visible}
.cfoot .sp{flex:1}
.cfoot{flex-wrap:wrap;row-gap:4px}
.cbtn{border:none;background:transparent;font-size:12px;color:#8a8886;padding:2px 5px;border-radius:4px;white-space:nowrap}
.cbtn:hover{background:#edebe9;color:#242424}
.ct-row{display:flex;gap:8px;align-items:flex-start}
.ct-row .ct{flex:1}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid #8a8886;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:transparent;flex-shrink:0;padding:0;margin-top:1px;cursor:pointer}
.chk:hover{border-color:#107c10;color:#107c10}
.chk.on{background:#107c10;border-color:#107c10;color:#fff}
.chk.big{width:22px;height:22px;font-size:13px;margin-top:9px}
.card.done .ct,.done-t{color:#8a8886;text-decoration:line-through}
.card.done .lbls,.card.done .cmeta{opacity:.6}
.pn-trow{display:flex;gap:6px;align-items:flex-start}
.pn-trow.done .pn-title{color:#8a8886;text-decoration:line-through}
.pn-del{margin-top:14px}
.trash-i{flex:1;cursor:pointer;padding:2px 4px;border-radius:4px}
.trash-i:hover{background:#f3f2f1}
.newtask{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:8px;margin:0 2px 8px}
.newtask input{width:100%}
.nt-btns{display:flex;gap:6px;margin-top:6px}
.add-col{padding-top:4px}
.addb{color:#0f6cbd;padding:8px 6px;cursor:pointer;font-weight:600}
.empty{color:#8a8886;padding:40px;text-align:center}
/* grid */
.gridwrap{padding:14px 18px}
table.grid{border-collapse:collapse;width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.grid th{background:#faf9f8;text-align:left;font-weight:600;font-size:12px;color:#605e5c;padding:9px 10px;border-bottom:1px solid #e1dfdd;cursor:pointer;white-space:nowrap;user-select:none}
.grid th:hover{background:#f3f2f1}
.grid td{padding:8px 10px;border-bottom:1px solid #f3f2f1;vertical-align:middle}
.grid tr.row{cursor:pointer}
.grid tr.row:hover td{background:#f5f9fd}
.grid .late{color:#a4262c;font-weight:600}
.grid td.ttl{font-weight:500;max-width:340px}
/* schedule */
.cal-wrap{display:flex;gap:14px;padding:14px 18px;height:100%}
.cal{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.12);min-width:0}
.cal-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #e1dfdd}
.cal-h .m{font-size:16px;font-weight:600;min-width:120px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;flex:1;min-height:0}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:#605e5c;border-bottom:1px solid #e1dfdd}
.cal-dow div{padding:6px 8px}
.cal-d{border-right:1px solid #f3f2f1;border-bottom:1px solid #f3f2f1;padding:4px;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.cal-d.other{background:#faf9f8;color:#a19f9d}
.cal-d .dn{font-size:12px;padding:2px 4px}
.cal-d.today .dn{background:#0f6cbd;color:#fff;border-radius:10px;display:inline-block;align-self:flex-start}
.cal-d.over,.nodue.over{background:#deecf9}
.cal-items{overflow-y:auto;flex:1}
.chip{font-size:12px;background:#deecf9;border-left:3px solid #0f6cbd;padding:2px 6px;border-radius:3px;margin:2px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.late{background:#fde7e9;border-color:#d13438}
.chip.done{text-decoration:line-through;color:#8a8886;background:#f3f2f1;border-color:#a19f9d}
.nodue{width:230px;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.12);padding:10px;overflow-y:auto;flex-shrink:0}
.nodue h4{margin:0 0 8px;font-size:13px}
/* panel */
#panel{position:fixed;top:0;right:0;height:100vh;width:480px;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.16);z-index:40;transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
#panel.open{transform:none}
.pn-h{display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid #e1dfdd}
.crumb{font-size:12px;color:#605e5c;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-b{flex:1;overflow-y:auto;padding:14px 18px 30px}
.pn-title{width:100%;font-size:18px;font-weight:600;border-color:transparent;padding:6px 8px}
.pn-title:hover{border-color:#d1d1d1}
.row{margin-top:16px;position:relative}
.row>label,.lbl{display:block;font-size:12px;font-weight:600;color:#605e5c;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.achip{display:inline-flex;align-items:center;gap:5px;background:#f3f2f1;border-radius:14px;padding:2px 4px 2px 2px;font-size:13px}
.achip .x,.lchip .x{border:none;background:transparent;padding:0 4px;cursor:pointer;color:inherit;opacity:.6}
.achip .x:hover,.lchip .x:hover{opacity:1}
.addchip{border:1px dashed #a19f9d;background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;color:#605e5c}
.addchip:hover{border-color:#0f6cbd;color:#0f6cbd}
.pop{position:absolute;z-index:5;left:0;top:100%;background:#fff;border:1px solid #e1dfdd;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:8px;width:280px;max-height:320px;overflow:auto;margin-top:4px}
.popi{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer}
.popi:hover{background:#f3f2f1}
.popdate{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.popdate .pdl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#605e5c}
.dfield{position:relative;display:flex;align-items:stretch;width:100%}
.dfield .dtext{flex:1;min-width:0;width:100%;border-top-right-radius:0;border-bottom-right-radius:0;font-weight:400}
.dfield .dtext.bad{border-color:#d13438;box-shadow:0 0 0 1px #d13438;background:#fdf3f4}
.dfield .dpick{border:1px solid #d1d1d1;border-left:none;background:#fff;border-radius:0 4px 4px 0;padding:0 7px;font-size:13px}
.dfield .dpick:hover{background:#f3f2f1}
.dfield .dhid{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;padding:0;border:0;pointer-events:none}
.popnew{display:flex;gap:4px;border-top:1px solid #edebe9;margin-top:6px;padding-top:8px}
.popnew input{flex:1;min-width:0}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-top:16px}
.grid3 select,.grid3 input{width:100%}
textarea{width:100%;resize:vertical}
.cl-i{display:flex;align-items:center;gap:6px;padding:2px 0}
.cl-i input[type=text]{flex:1;border-color:transparent}
.cl-i input[type=text]:hover{border-color:#d1d1d1}
.cl-i.done input[type=text]{text-decoration:line-through;color:#8a8886}
.cl-add{width:100%;margin-top:4px}
.ln-i{display:flex;align-items:center;gap:6px;padding:3px 0}
.ln-i a{flex:1;color:#0f6cbd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkadd{display:grid;grid-template-columns:1fr 120px auto;gap:6px;margin-top:6px}
.cmt{background:#faf9f8;border-radius:6px;padding:8px 10px;margin-top:8px}
.cmt-h{display:flex;align-items:center;gap:6px;font-size:12px;color:#605e5c;margin-bottom:4px}
.cmt-h b{color:#242424}
.cmt-b{white-space:pre-wrap;word-break:break-word}
.pn-foot{margin-top:22px;font-size:12px;color:#8a8886;border-top:1px solid #edebe9;padding-top:10px;line-height:1.7}
.linkbtn{border:none;background:none;color:#0f6cbd;padding:0;text-decoration:underline}
/* menus & modal */
#cpop{position:fixed;z-index:60;display:none;margin-top:0;top:0;left:0}
.addchip.csm{font-size:11px;padding:1px 8px;margin-left:4px}
#ctx{position:fixed;z-index:100;background:#fff;border:1px solid #e1dfdd;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px 0;min-width:170px;display:none}
.mi{padding:7px 14px;cursor:pointer;white-space:nowrap}
.mi:hover{background:#f3f2f1}
.mi.danger{color:#a4262c}
.sep{height:1px;background:#edebe9;margin:4px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:520px;max-width:94vw;max-height:86vh;display:flex;flex-direction:column}
.mbox.wide{width:980px}
.mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid #edebe9;font-weight:600;font-size:16px}
.mh .ib{margin-left:auto}
.mb{padding:14px 18px;overflow:auto}
.mrow{display:flex;gap:8px;align-items:center;padding:4px 0}
.mrow input[type=text]{flex:1}
.hist{border-collapse:collapse;width:100%;font-size:13px}
.hist th{background:#faf9f8;text-align:left;padding:7px 8px;border-bottom:1px solid #e1dfdd;white-space:nowrap;position:sticky;top:-14px}
.hist td{padding:7px 8px;border-bottom:1px solid #f3f2f1;vertical-align:top;word-break:break-word}
.hist .from{color:#a4262c}.hist .to{color:#107c10}
.muted{color:#8a8886;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:#f3f2f1;font-weight:600}
.tag.c{background:#dff6dd;color:#107c10}.tag.m{background:#deecf9;color:#0f548c}.tag.d{background:#fde7e9;color:#a4262c}.tag.r{background:#fff4ce;color:#835b00}.tag.k{background:#efe6fa;color:#5c2e91}
/* start */
.start{display:flex;align-items:center;justify-content:center;height:100vh;width:100%}
.start-box{background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:34px 38px;width:560px;max-width:94vw}
.start-box h1{margin:0 0 6px;color:#0f6cbd;font-size:24px}
.start-box p{color:#424242;line-height:1.6}
.start-box .btn{display:block;width:100%;padding:10px;margin-top:10px;font-size:15px}
.hint{margin-top:18px;font-size:12px;color:#605e5c;line-height:1.7;background:#faf9f8;border-radius:6px;padding:10px 12px}
.warn{background:#fde7e9;color:#a4262c;border-radius:6px;padding:10px 12px;margin-top:12px;font-size:13px}
.start-box .sub{font-size:13px;color:#605e5c;margin:16px 0 4px;font-weight:600}
.start-box input.full{width:100%;margin-top:6px;padding:9px 10px}
.acct{display:flex;align-items:center;gap:8px;font-size:13px;color:#424242;background:#f3f2f1;border-radius:6px;padding:8px 10px;margin-top:8px}
.acct .linkbtn{margin-left:auto}
.status.auth .dot{background:#d13438}.status.auth{color:#a4262c}
.status .btn{margin-top:6px;padding:3px 10px;font-size:12px}
.mnav{display:none;font-size:20px;padding:2px 8px}
#nav .nav-item.over{background:#cfe4fa;box-shadow:inset 0 0 0 2px #0f6cbd}
/* 휴대폰 화면 */
@media (hover:none){ .cfoot .ib{visibility:visible} }
@supports (height:100dvh){ body,#app,.start,#panel{height:100dvh} }
@media (max-width:760px){
  input,select,textarea{font-size:16px}
  .mnav{display:inline-block}
  #nav{position:fixed;left:0;top:0;bottom:0;z-index:85;width:264px;transform:translateX(-105%);transition:transform .18s;box-shadow:6px 0 24px rgba(0,0,0,.2);overflow-y:auto}
  body.navopen #nav{transform:none}
  body.navopen #main::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:84}
  .ph{padding:6px 10px 0}
  .ph-top{gap:6px}
  .ptitle{font-size:16px;max-width:calc(100vw - 130px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pdot.big{width:28px;height:28px;font-size:13px}
  .tabs{margin-left:0;order:3;width:100%}
  .tab{padding:8px 10px 7px}
  .ph-right{margin-left:0;order:4;width:100%;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
  .ph-right .ib{margin-left:auto}
  .search{flex:1 1 100%;width:auto;min-width:0}
  .fpanel{left:8px;right:8px;width:auto}
  .board{padding:10px 10px 0;gap:10px;scroll-snap-type:x mandatory}
  .col{width:calc(100vw - 40px);scroll-snap-align:center}
  .gridwrap{padding:10px;overflow-x:auto}
  .cal-wrap{flex-direction:column;padding:10px;gap:10px}
  .nodue{width:auto;max-height:28vh}
  .cal-d .chip{font-size:11px;padding:1px 3px}
  #panel{width:100vw}
  .pn-b{padding:12px 14px 30px}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3>:first-child{grid-column:1 / -1}
  .linkadd{grid-template-columns:1fr}
  .mbox,.mbox.wide{width:100vw;max-width:100vw;max-height:92vh;border-radius:10px 10px 0 0;align-self:flex-end}
  .start-box{padding:22px 18px}
  #cpop{max-width:calc(100vw - 16px)}
}
</style>
</head>
<body>
<div id="app"></div>
<aside id="panel"></aside>
<div id="ctx"></div>
<div id="cpop" class="pop"></div>
<div id="modal"></div>
<script>
'use strict';
/* =========================================================
   팀 플래너 — 단일 HTML. 데이터는 공유 폴더의 planner_data.json
   병합 규칙: 엔터티의 필드별 수정시각(_v)이 늦은 값을 채택
   ========================================================= */
const FILE = 'planner_data.json';
const LS_KEY = 'teamPlanner.localDb', LS_USER = 'teamPlanner.user', LS_UI = 'teamPlanner.ui';
const COLLS = ['plans','buckets','tasks','labels','members','comments','history'];

const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const endOfWeek = s => addDays(s, 6 - parseD(s).getDay());
const fmtTs = t => { if(!t) return ''; const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const hash = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const same = (a,b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

/* ---------- data model & merge ---------- */
function emptyDb(){ const d = {schema:1}; COLLS.forEach(c => d[c] = {}); return d; }
function normDb(d){ d = d || {}; const o = {schema:1}; COLLS.forEach(c => o[c] = (d[c] && typeof d[c]==='object') ? d[c] : {}); return o; }
function mergeEnt(a, b){
  const va = a._v || {}, vb = b._v || {}, r = {id: a.id || b.id, _v:{}};
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]); keys.delete('_v'); keys.delete('id');
  for (const k of keys){
    const ta = va[k] || 0, tb = vb[k] || 0;
    if (tb > ta || (tb === ta && !(k in a))) { r[k] = b[k]; r._v[k] = tb; } else { r[k] = a[k]; r._v[k] = ta; }
  }
  return r;
}
function merge(a, b){
  const r = {schema:1};
  for (const c of COLLS){
    const A1 = a[c] || {}, B1 = b[c] || {}; r[c] = {};
    for (const id of new Set([...Object.keys(A1), ...Object.keys(B1)])){
      const pa = A1[id]?.purged, pb = B1[id]?.purged;   // 영구 삭제(보관기간 경과) 표식은 항상 우선
      if (pa || pb){ r[c][id] = JSON.parse(JSON.stringify(pa ? A1[id] : B1[id])); continue; }
      r[c][id] = (A1[id] && B1[id]) ? mergeEnt(A1[id], B1[id]) : JSON.parse(JSON.stringify(A1[id] || B1[id]));
    }
  }
  return r;
}
function create(c, obj){
  const t = now();
  const e = Object.assign({id: uid()}, obj, {deleted:false, createdBy:S.user, createdAt:Date.now()});
  const pid = obj.planId || (obj.taskId && S.db.tasks[obj.taskId]?.planId);   // 비공개 플랜에 속한 항목은 priv 표시 → 공유 파일에 쓰지 않음
  if ((c === 'plans' && obj.priv) || (pid && S.db.plans[pid]?.priv)) e.priv = true;
  e._v = {}; for (const k of Object.keys(e)) if (k !== 'id' && k !== '_v') e._v[k] = t;
  S.db[c][e.id] = e; markDirty(e); return e;
}
function setF(c, id, f, v){ const e = S.db[c][id]; if (!e) return; e[f] = v; e._v = e._v || {}; e._v[f] = now(); markDirty(e); }
/* 공유 파일용(비공개 항목 제외) / 비공개 파일용(비공개 항목만) 사본 */
function splitDb(db, priv){ const o = {schema:1}; COLLS.forEach(c => { o[c] = {}; for (const [id, e] of Object.entries(db[c] || {})) if (!!e.priv === priv) o[c][id] = e; }); return o; }
const pubDb = db => splitDb(db, false), privDb = db => splitDb(db, true);

const act = c => Object.values(S.db[c]).filter(x => !x.deleted);
const plans = () => act('plans').sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
const buckets = pid => act('buckets').filter(b => b.planId === pid).sort((a,b) => (a.order||0) - (b.order||0));
const labelsOf = pid => act('labels').filter(l => l.planId === pid).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
const members = () => act('members').sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
const tasksOf = pid => act('tasks').filter(t => t.planId === pid);
const isMember = id => S.db.members[id] && !S.db.members[id].deleted;
const isLabel = id => S.db.labels[id] && !S.db.labels[id].deleted;
const memberName = id => S.db.members[id]?.name || '(알 수 없음)';
const myName = () => S.db.members[S.user]?.name || '익명';
const curPlan = () => { const p = S.db.plans[S.ui.planId]; return p && !p.deleted ? p : null; };
function effBucket(t){ const b = S.db.buckets[t.bucketId]; if (b && !b.deleted && b.planId === t.planId) return b.id; return buckets(t.planId)[0]?.id || null; }

/* ---------- history ---------- */
function logH(taskId, action, field, from, to){
  create('history', {taskId, planId: S.db.tasks[taskId]?.planId || '', ts: Date.now(), user: S.user, userName: myName(), action, field, from: String(from ?? ''), to: String(to ?? '')});
}
function fmtVal(f, v){
  switch (f){
    case 'assignees': return (v||[]).map(memberName).join(', ');
    case 'labels': return (v||[]).map(id => S.db.labels[id]?.name || '?').join(', ');
    case 'bucketId': return S.db.buckets[v]?.name || '';
    case 'notes': { const s = v || ''; return s.length > 300 ? s.slice(0,300) + '…' : s; }
    default: return v ?? '';
  }
}
function touch(id){ setF('tasks', id, 'updatedBy', S.user); setF('tasks', id, 'updatedAt', Date.now()); }
function updateTask(id, f, v, o = {}){
  const t = S.db.tasks[id]; if (!t) return false;
  const old = t[f]; if (same(old, v)) return false;
  setF('tasks', id, f, v); touch(id);
  if (!o.noLog) logH(id, f === 'bucketId' ? '이동' : '수정', FIELD_NAMES[f] || f, fmtVal(f, old), fmtVal(f, v));
  if (!o.noRender) render();
  return true;
}

/* ---------- storage ---------- */
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('teamPlanner', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch(e){ return null; } }
async function idbSet(k, v){ try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch(e){} }

async function readJson(fh){
  const f = await fh.getFile(); const txt = await f.text();
  return {lm: f.lastModified, data: txt.trim() ? JSON.parse(txt) : emptyDb()};
}
async function scanConflicts(){
  const list = [];
  for await (const [name, h] of S.dir.entries()){
    if (h.kind === 'file' && name !== FILE && /^planner_data.*\.json$/i.test(name)) list.push({name, h});
  }
  return list;
}
async function pullRemote(){
  const r = await readJson(S.fh);             // JSON 오류 시 예외 → 덮어쓰지 않음
  let remote = normDb(r.data);
  const conf = await scanConflicts();
  for (const c of conf){ try { remote = merge(remote, normDb((await readJson(c.h)).data)); } catch(e){} }
  return {remote, lm: r.lm, conf};
}
function markDirty(e){ if (e?.priv){ pMarkDirty(); return; } S.dirty = true; scheduleSave(); }
function scheduleSave(){ clearTimeout(S.saveTimer); S.saveTimer = setTimeout(saveNow, 700); }
async function saveNow(){
  if (!S.mode) return;
  if (S.mode === 'local'){ localStorage.setItem(LS_KEY, JSON.stringify(S.db)); S.dirty = false; setStatus('local'); return; }
  if (S.saving){ S.saveAgain = true; return; }
  S.saving = true; setStatus('saving');
  try {
    if (S.mode === 'graph') await gSave();
    else {
      const {remote, conf} = await pullRemote();
      S.db = merge(S.db, remote);
      const w = await S.fh.createWritable(); await w.write(JSON.stringify(S.db)); await w.close();
      for (const c of conf){ try { await S.dir.removeEntry(c.name); } catch(e){} }
      S.lastLm = (await S.fh.getFile()).lastModified;
    }
    S.dirty = false; setStatus('ok');
    dailyBackup();
  } catch(e){
    if (e.auth) setStatus('auth', e.message);
    else { setStatus('err', e.message || String(e)); setTimeout(scheduleSave, 5000); }
  }
  S.saving = false;
  if (S.saveAgain){ S.saveAgain = false; saveNow(); }
}
async function dailyBackup(){
  const d = today().replace(/-/g,''); if (S.lastBackup === d) return;
  if (S.mode === 'graph'){ try { await gBackup(`planner_data_${d}.json`); S.lastBackup = d; } catch(e){} return; }
  try {
    const bd = await S.dir.getDirectoryHandle('backup', {create:true}); const name = `planner_data_${d}.json`;
    try { await bd.getFileHandle(name); } catch(e){ const h = await bd.getFileHandle(name, {create:true}); const w = await h.createWritable(); await w.write(JSON.stringify(S.db)); await w.close(); }
    S.lastBackup = d;
  } catch(e){}
}
async function poll(force){
  if (S.mode === 'graph'){
    if (S.saving || S.drag || S.status.kind === 'auth') return;
    if (!force && (document.visibilityState !== 'visible' || Date.now() - (S.g.polledAt || 0) < 7500)) return;
    S.g.polledAt = Date.now();
    try {
      const {remote, etag, conf} = await gPull(false);
      const before = JSON.stringify(S.db);
      S.db = merge(S.db, remote); S.g.etag = etag;
      if (conf.length){ S.g.confAt = 0; scheduleSave(); }   // 저장할 때 충돌 사본을 다시 합치고 지움
      if (JSON.stringify(S.db) !== before){ gCacheSave(); render(); }
      if (S.status.kind === 'err' && !S.dirty) setStatus('ok');
    } catch(e){ e.auth ? setStatus('auth', e.message) : setStatus('err', e.message || String(e)); }
    await pPoll();
    return;
  }
  if (S.mode !== 'file' || S.saving || S.drag) return;
  try {
    const f = await S.fh.getFile(); const conf = await scanConflicts();
    if (f.lastModified !== S.lastLm || conf.length){
      const {remote, lm} = await pullRemote();
      const before = JSON.stringify(S.db);
      S.db = merge(S.db, remote); S.lastLm = lm;
      if (conf.length) scheduleSave();
      if (JSON.stringify(S.db) !== before) render();
    }
    if (S.status.kind === 'err' && !S.dirty) setStatus('ok');
  } catch(e){ setStatus('err', e.message || String(e)); }
}
function setStatus(kind, msg){
  S.status = {kind, msg: msg || '', at: Date.now()};
  const el = $('#status'); if (el){ el.className = 'status ' + kind; el.innerHTML = statusHtml(); }
}
function statusHtml(){
  const s = S.status;
  if (S.mode === 'local') return `<span class="dot"></span>체험 모드 — 이 PC 브라우저에만 저장`;
  const where = S.mode === 'graph' ? `☁ ${esc(S.g.name)}` : S.dir ? `📁 ${esc(S.dir.name)}` : '';
  if (s.kind === 'auth') return `<span class="dot"></span>로그인이 만료되어 저장을 멈췄습니다. 수정한 내용은 이 기기에 보관 중입니다.<br><button class="btn primary" data-act="ms-relogin">다시 로그인</button>`;
  if (s.kind === 'saving') return `<span class="dot"></span>저장 중…<br>${where}`;
  if (s.kind === 'err') return `<span class="dot"></span>저장·동기화 오류: ${esc(s.msg)}<br>5초 후 다시 시도합니다.<br>${where}`;
  return `<span class="dot"></span>동기화됨 ${s.at ? fmtTs(s.at).slice(11) : ''}<br>${where}`;
}

/* =========================================================
   Microsoft 계정 모드 — OneDrive 파일을 Microsoft Graph로 직접 읽고 씀
   (휴대폰·PC 브라우저 공통. 로그인은 OAuth 2.0 인증 코드 + PKCE, 비밀키 없음)
   ========================================================= */
const MS = {
  clientId: 'bfa5d217-d5b3-490a-82d3-e39b2567f0d7',   // Azure '앱 등록'의 애플리케이션(클라이언트) ID
  tenant: 'consumers',          // 개인 Microsoft 계정. 회사 계정도 함께 쓰려면 'common'
  scopes: 'Files.ReadWrite.All User.Read offline_access'
};
const GRAPH = 'https://graph.microsoft.com/v1.0';
const LS_TOK = 'teamPlanner.msToken', LS_GF = 'teamPlanner.gFolder', LS_GCACHE = 'teamPlanner.gCache', SS_PKCE = 'teamPlanner.pkce', SS_SILENT = 'teamPlanner.silentTried';
const msSecure = () => location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const msReady = () => !!MS.clientId && msSecure() && !!window.crypto?.subtle;
const msRedirect = () => location.origin + location.pathname.replace(/index\.html$/i, '');
const msAuthUrl = p => `https://login.microsoftonline.com/${MS.tenant}/oauth2/v2.0/${p}`;
const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const lsJson = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } };
const msTok = () => lsJson(LS_TOK);
const gFolder = () => lsJson(LS_GF);

async function msLogin(silent){
  gCacheSave();                                   // 로그인 화면으로 넘어가도 수정 내용이 남도록
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.setItem(SS_PKCE, JSON.stringify({verifier, state, silent: !!silent}));
  const p = new URLSearchParams({client_id: MS.clientId, response_type: 'code', redirect_uri: msRedirect(), scope: MS.scopes,
    code_challenge: challenge, code_challenge_method: 'S256', state, response_mode: 'query'});
  const hint = msTok()?.hint;
  if (silent){ p.set('prompt', 'none'); if (hint) p.set('login_hint', hint); } else p.set('prompt', 'select_account');
  location.assign(msAuthUrl('authorize') + '?' + p);
}
async function msTokenReq(params){
  const body = new URLSearchParams(Object.assign({client_id: MS.clientId, scope: MS.scopes}, params));
  const r = await fetch(msAuthUrl('token'), {method: 'POST', body});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error_description || j.error || ('HTTP ' + r.status)), {auth: true});
  const old = msTok() || {};
  const tok = {at: j.access_token, exp: Date.now() + ((j.expires_in || 3600) - 120) * 1000, rt: j.refresh_token || old.rt, hint: old.hint || '', name: old.name || ''};
  localStorage.setItem(LS_TOK, JSON.stringify(tok)); return tok;
}
/* 로그인 화면에서 돌아왔을 때(주소에 ?code=) 토큰 교환 */
async function msHandleRedirect(){
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return null;
  const pk = lsJsonS(SS_PKCE); sessionStorage.removeItem(SS_PKCE);
  history.replaceState(null, '', msRedirect());
  if (!pk || q.get('state') !== pk.state) return {err: '로그인 확인 값이 맞지 않습니다. 다시 로그인해 주세요.'};
  if (q.has('error')) return {err: q.get('error_description') || q.get('error'), silent: pk.silent};
  await msTokenReq({grant_type: 'authorization_code', code: q.get('code'), redirect_uri: msRedirect(), code_verifier: pk.verifier});
  try { const me = await gjson('/me?$select=displayName,userPrincipalName,mail'); const t = msTok(); t.name = me.displayName || ''; t.hint = me.userPrincipalName || me.mail || ''; localStorage.setItem(LS_TOK, JSON.stringify(t)); } catch(e){}
  return {ok: true};
}
function lsJsonS(k){ try { return JSON.parse(sessionStorage.getItem(k) || 'null'); } catch(e){ return null; } }
async function msToken(){
  const t = msTok();
  if (t?.at && t.exp > Date.now()) return t.at;
  if (t?.rt){ try { return (await msTokenReq({grant_type: 'refresh_token', refresh_token: t.rt})).at; } catch(e){} }
  throw Object.assign(new Error('로그인이 만료되었습니다.'), {auth: true});
}
function msLogout(){
  if ((S.dirty || S.p.dirty) && !confirm('아직 저장되지 않은 변경이 있습니다. 그래도 로그아웃할까요?')) return;
  pDrop(); localStorage.removeItem(LS_PCACHE);
  [LS_TOK, LS_GF, LS_GCACHE, LS_USER].forEach(k => localStorage.removeItem(k)); S.user = null; S.me = null;
  S.mode = null; S.g = {}; S.db = emptyDb(); S.gErr = ''; render();
}

/* ---------- Graph 호출 ---------- */
function gErr(r, txt){ let m = ''; try { m = JSON.parse(txt).error.message; } catch(e){} const e = new Error(`${r.status}${m ? ' ' + m : ''}`); e.status = r.status; if (r.status === 401) e.auth = true; return e; }
async function gfetch(path, o = {}){
  let r;
  for (let i = 0; i < 4; i++){
    const at = await msToken();
    r = await fetch(/^https:/.test(path) ? path : GRAPH + path, Object.assign({}, o, {headers: Object.assign({Authorization: 'Bearer ' + at}, o.headers || {})}));
    if (r.status === 401 && i === 0){ const t = msTok(); if (t){ t.exp = 0; localStorage.setItem(LS_TOK, JSON.stringify(t)); } continue; }
    if ([429, 503, 504].includes(r.status) && i < 3){ await new Promise(s => setTimeout(s, Math.min(10, Number(r.headers.get('Retry-After')) || 2) * 1000)); continue; }
    break;
  }
  return r;
}
async function gjson(path, o){ const r = await gfetch(path, o); const txt = await r.text(); if (!r.ok) throw gErr(r, txt); return txt ? JSON.parse(txt) : {}; }
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
const gBase = () => `/drives/${S.g.driveId}/items/${S.g.folderId}`;
async function gMeta(rel){ const r = await gfetch(`${gBase()}:/${encPath(rel)}`); const txt = await r.text(); if (r.status === 404) return null; if (!r.ok) throw gErr(r, txt); return JSON.parse(txt); }
async function gDownload(meta){
  let u = meta['@microsoft.graph.downloadUrl'];
  if (!u){ const m = await gjson(`/drives/${meta.parentReference?.driveId || S.g.driveId}/items/${meta.id}`); u = m['@microsoft.graph.downloadUrl']; }
  const r = await fetch(u, {cache: 'no-store'}); const txt = await r.text();
  if (!r.ok) throw new Error('파일을 받지 못했습니다 (' + r.status + ')');
  return txt.trim() ? JSON.parse(txt) : emptyDb();      // JSON 오류 시 예외 → 덮어쓰지 않음
}
/* 폴더 찾기: ① 공유 링크 ② 내 OneDrive 안의 경로(바로 가기 폴더도 따라감) */
async function gResolve(input){
  input = input.trim().replace(/^["']|["']$/g, '');
  let it;
  if (/^https?:\/\//i.test(input)){
    const id = 'u!' + b64url(new TextEncoder().encode(input));
    it = await gjson(`/shares/${id}/driveItem`, {headers: {Prefer: 'redeemSharingLink'}});
  } else {
    const segs = input.replace(/\\/g, '/').split('/').map(s => s.trim()).filter(Boolean);
    if (!segs.length) throw new Error('경로를 입력해 주세요.');
    let cur = '/me/drive/root';
    for (const s of segs){
      it = await gjson(`${cur}:/${encodeURIComponent(s)}`).catch(e => { throw e.status === 404 ? new Error(`‘${s}’ 폴더를 찾지 못했습니다.`) : e; });
      const ri = it.remoteItem;
      cur = ri ? `/drives/${ri.parentReference.driveId}/items/${ri.id}` : `/drives/${it.parentReference.driveId}/items/${it.id}`;
    }
  }
  const ri = it.remoteItem;
  let driveId = ri ? ri.parentReference.driveId : it.parentReference.driveId, folderId = ri ? ri.id : it.id, name = it.name;
  if (!(ri ? ri.folder : it.folder)){                    // 파일 링크를 넣은 경우 그 파일이 든 폴더
    const pr = (ri || it).parentReference; driveId = pr.driveId; folderId = pr.id;
    name = (await gjson(`/drives/${driveId}/items/${folderId}?$select=name`)).name;
  }
  return {driveId, folderId, name};
}
async function gConflicts(){
  const j = await gjson(`${gBase()}/children?$select=id,name,file&$top=999`);
  return (j.value || []).filter(x => x.file && x.name !== FILE && /^planner_data.*\.json$/i.test(x.name));
}
/* 원격 파일 읽기. 마지막으로 읽거나 쓴 뒤 바뀌지 않았으면(eTag 동일) 내려받지 않음 */
async function gPull(forceConf){
  const meta = await gMeta(FILE);
  let remote = emptyDb(); const etag = meta ? meta.eTag : null;
  if (meta && etag !== S.g.etag) remote = normDb(await gDownload(meta));
  let conf = [];
  if (forceConf || Date.now() - (S.g.confAt || 0) > 60000){
    S.g.confAt = Date.now();
    try { conf = await gConflicts(); } catch(e){}
    for (const c of conf){ try { remote = merge(remote, normDb(await gDownload(c))); } catch(e){} }
  }
  return {remote, etag, conf};
}
/* 저장: 읽기 → 병합 → eTag가 그대로일 때만 쓰기(If-Match). 그 사이 누가 저장했으면 다시 읽어 병합 */
async function gSave(){
  gCacheSave();
  for (let i = 0; ; i++){
    const {remote, etag, conf} = await gPull(i === 0 ? false : true);
    S.db = merge(S.db, remote);
    const q = etag ? '' : '?@microsoft.graph.conflictBehavior=fail';
    const r = await gfetch(`${gBase()}:/${encPath(FILE)}:/content${q}`, {method: 'PUT',
      headers: Object.assign({'Content-Type': 'application/json'}, etag ? {'If-Match': etag} : {}), body: JSON.stringify(pubDb(S.db))});
    const txt = await r.text();
    if ((r.status === 412 || r.status === 409) && i < 5){ S.g.etag = '__stale__'; continue; }
    if (!r.ok) throw gErr(r, txt);
    S.g.etag = JSON.parse(txt).eTag;
    for (const c of conf) gfetch(`/drives/${S.g.driveId}/items/${c.id}`, {method: 'DELETE'}).catch(() => {});
    break;
  }
  gCacheSave();
}
async function gBackup(name){
  if (await gMeta(`backup/${name}`)) return;
  const put = () => gfetch(`${gBase()}:/backup/${encodeURIComponent(name)}:/content?@microsoft.graph.conflictBehavior=fail`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(pubDb(S.db))});
  let r = await put();
  if (!r.ok && r.status !== 409){
    await gfetch(`${gBase()}/children`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: 'backup', folder: {}, '@microsoft.graph.conflictBehavior': 'fail'})});
    r = await put();
  }
}
/* 이 기기 임시 보관(로그인 만료·연결 끊김 때 수정분 보존). 다음 연결 때 병합 */
const gKey = () => `${S.g.driveId}/${S.g.folderId}`;
function gCacheSave(){ if (S.mode !== 'graph') return; try { localStorage.setItem(LS_GCACHE, JSON.stringify({key: gKey(), dirty: S.dirty, db: pubDb(S.db)})); } catch(e){} pCacheSave(); }
async function gConnect(f){
  S.g = {driveId: f.driveId, folderId: f.folderId, name: f.name, etag: null, confAt: 0, polledAt: Date.now()};
  const {remote, etag, conf} = await gPull(true);
  let db = remote, fromCache = false;
  const c = lsJson(LS_GCACHE);
  if (c && c.key === gKey() && c.db){ const m = merge(db, normDb(c.db)); fromCache = JSON.stringify(m) !== JSON.stringify(db); db = m; }
  const me = await gjson('/me?$select=id,displayName,userPrincipalName,mail');
  S.me = {id: me.id || '', email: (me.userPrincipalName || me.mail || '').toLowerCase(), name: me.displayName || ''};
  S.g.acctCode = await acctCode(S.me.id);
  S.g.owner = PRIV_OWNERS.includes(S.g.acctCode);      // 비공개 플랜은 지정한 계정만 사용
  pDrop();
  S.db = db; S.g.etag = etag; S.mode = 'graph'; S.dir = null; S.gErr = '';
  localStorage.setItem(LS_GF, JSON.stringify(f)); sessionStorage.removeItem(SS_SILENT);
  setStatus('ok');
  if (conf.length || fromCache || !etag){ S.g.confAt = 0; S.dirty = true; scheduleSave(); }
  afterLoad();
}
async function gStart(input){
  S.gBusy = true; S.gErr = ''; render();
  try { await gConnect(await gResolve(input)); }
  catch(e){ S.gErr = e.status === 403 ? '이 폴더에 접근할 권한이 없습니다. 편집 권한으로 공유받았는지 확인해 주세요.' : e.status === 404 ? '폴더를 찾지 못했습니다. 링크나 경로를 확인해 주세요.' : (e.message || String(e)); if (e.auth){ S.gErr = '로그인이 만료되었습니다. 다시 로그인해 주세요.'; } }
  S.gBusy = false; if (S.mode !== 'graph') render();
}

/* =========================================================
   비공개 플랜 — 공유 폴더 소유자 본인만 사용
   · 저장 위치: 본인 OneDrive의 앱 폴더(앱/팀플래너/private_plans.json). 공유 파일·백업에는 들어가지 않음
   · 내용은 암호로 암호화(PBKDF2-SHA256 → AES-GCM 256). 암호를 잊으면 복구 불가
   · 마지막 조작 후 10분이 지나면 자동으로 잠김(화면에서 비공개 항목을 모두 지움)
   ========================================================= */
const P_FILE = 'private_plans.json', P_ITER = 310000, P_IDLE = 10 * 60000, LS_PCACHE = 'teamPlanner.pCache';
const P_PATH = `/me/drive/special/approot:/${P_FILE}`;
/* 비공개 플랜을 쓸 수 있는 계정의 '계정 코드'(Microsoft 계정 ID를 SHA-256으로 바꾼 값 앞 20자리. 이메일·ID 원문은 넣지 않음)
   계정 코드는 로그인 후 '구성원 관리'의 내 이름 줄에 표시됨 */
const PRIV_OWNERS = ['62a27da9200033eb1917'];
async function acctCode(id){
  if (!id) return '';
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('teamPlanner:' + String(id).toLowerCase())));
  return Array.from(h, b => b.toString(16).padStart(2, '0')).join('').slice(0, 20);
}
S.p = {key: null};
const pOwner = () => S.mode === 'graph' && !!S.g.owner;
const pOpen = () => !!S.p.key;
function b64e(bytes){ let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s){ const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function pDerive(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function pEncrypt(obj, key = S.p.key, salt = S.p.salt, iter = S.p.iter){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {app: 'teamPlanner-private', v: 1, kdf: 'PBKDF2-SHA256', iter, salt: b64e(salt), iv: b64e(iv), ct: b64e(ct)};
}
async function pDecrypt(env, key){   // 암호가 틀리면 예외(AES-GCM 인증 실패)
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64d(env.iv)}, key, b64d(env.ct));
  const d = normDb(JSON.parse(new TextDecoder().decode(pt)));
  COLLS.forEach(c => Object.values(d[c]).forEach(e => e.priv = true));
  return d;
}
async function pMeta(){ const r = await gfetch(P_PATH); const txt = await r.text(); if (r.status === 404) return null; if (!r.ok) throw gErr(r, txt); return JSON.parse(txt); }
async function pEnvelope(meta){ const j = await gDownload(meta); if (!j || !j.ct) throw new Error('비공개 파일 형식이 올바르지 않습니다.'); return j; }
function pMarkDirty(){ if (!pOpen()) return; S.p.dirty = true; clearTimeout(S.p.timer); S.p.timer = setTimeout(pSave, 700); }
/* 저장: 읽기 → 복호화·병합 → 암호화 → eTag가 그대로일 때만 쓰기 (다른 기기에서 고친 내용과 합침) */
async function pSave(){
  if (!pOpen()) return;
  if (S.p.saving){ S.p.again = true; return; }
  if (!S.p.dirty) return;
  const P = S.p; P.saving = true; P.dirty = false;
  try {
    for (let i = 0; ; i++){
      const meta = await pMeta();
      if (meta && meta.eTag !== P.etag){ const d = await pDecrypt(await pEnvelope(meta), P.key); if (S.p !== P) throw new Error('잠김'); const b = JSON.stringify(privDb(S.db)); S.db = merge(S.db, d); P.etag = meta.eTag; if (JSON.stringify(privDb(S.db)) !== b) P.changed = true; }
      if (S.p !== P) throw new Error('잠김');          // 잠근 뒤에는 (비어 있는) 화면 데이터로 덮어쓰지 않음
      const body = JSON.stringify(await pEncrypt(privDb(S.db), P.key, P.salt, P.iter));
      const q = meta ? '' : '?@microsoft.graph.conflictBehavior=fail';
      const r = await gfetch(`${P_PATH}:/content${q}`, {method: 'PUT', headers: Object.assign({'Content-Type': 'application/json'}, meta ? {'If-Match': meta.eTag} : {}), body});
      const txt = await r.text();
      if ((r.status === 412 || r.status === 409) && i < 5){ P.etag = '__stale__'; continue; }
      if (!r.ok) throw gErr(r, txt);
      P.etag = JSON.parse(txt).eTag; break;
    }
    P.err = ''; if (!P.dirty) localStorage.removeItem(LS_PCACHE);
  } catch(e){
    P.err = e.message || String(e); P.dirty = true;
    if (S.p === P){ pCacheSave(); if (!e.auth) setTimeout(() => { if (S.p === P) pSave(); }, 5000); }
  }
  P.saving = false;
  if (P.again && S.p === P){ P.again = false; pSave(); }
  else if (S.p === P){ if (P.changed){ P.changed = false; render(); } else renderNavOnly(); }
}
/* 저장 못 한 비공개 수정분은 이 기기에 '암호화한 채로' 보관했다가 다음에 잠금 해제할 때 합침 */
async function pCacheSave(){
  if (!pOpen() || !S.p.dirty) return;
  try { localStorage.setItem(LS_PCACHE, JSON.stringify(Object.assign(await pEncrypt(privDb(S.db)), {owner: S.me?.id || ''}))); } catch(e){}
}
async function pPoll(){
  if (!pOpen() || S.p.saving || S.p.dirty || S.p.locking) return;
  const P = S.p;
  try {
    const meta = await pMeta(); if (!meta || meta.eTag === P.etag) return;
    const d = await pDecrypt(await pEnvelope(meta), P.key);
    if (S.p !== P || P.saving || P.dirty) return;
    const before = JSON.stringify(privDb(S.db));
    S.db = merge(S.db, d); P.etag = meta.eTag;
    if (JSON.stringify(privDb(S.db)) !== before) render();
  } catch(e){}
}
async function pUnlock(pw){
  const meta = await pMeta();
  if (!meta) throw new Error('비공개 플랜 파일이 없습니다. 새로 만들어 주세요.');
  const env = await pEnvelope(meta), salt = b64d(env.salt), iter = env.iter || P_ITER;
  const key = await pDerive(pw, salt, iter);
  let d; try { d = await pDecrypt(env, key); } catch(e){ throw new Error('암호가 맞지 않습니다.'); }
  S.p = {key, salt, iter, etag: meta.eTag, act: Date.now()};
  S.db = merge(S.db, d);
  const c = lsJson(LS_PCACHE);                        // 이전에 저장하지 못한 수정분
  if (c && c.ct && c.salt === env.salt && (!c.owner || c.owner === S.me?.id)){ try { S.db = merge(S.db, await pDecrypt(c, key)); S.p.dirty = true; pSave(); } catch(e){} }
}
async function pCreate(pw){
  if (await pMeta()) throw new Error('이미 비공개 플랜 파일이 있습니다. 암호를 입력해 열어 주세요.');
  const salt = crypto.getRandomValues(new Uint8Array(16)), key = await pDerive(pw, salt, P_ITER);
  S.p = {key, salt, iter: P_ITER, etag: null, act: Date.now()};
  localStorage.removeItem(LS_PCACHE);
  const p = create('plans', {name: '내 비공개 플랜', priv: true}); create('buckets', {planId: p.id, name: '할 일', order: 0});
  await pSave(); if (S.p.err) throw new Error('저장하지 못했습니다: ' + S.p.err);
  S.ui.planId = p.id; S.ui.view = 'board';
}
async function pChangePw(cur, nw){
  const env = await pEnvelope(await pMeta());
  try { await pDecrypt(env, await pDerive(cur, b64d(env.salt), env.iter || P_ITER)); } catch(e){ throw new Error('현재 암호가 맞지 않습니다.'); }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  S.p.key = await pDerive(nw, salt, P_ITER); S.p.salt = salt; S.p.iter = P_ITER;
  localStorage.removeItem(LS_PCACHE);
  S.p.dirty = true; await pSave(); if (S.p.err) throw new Error('저장하지 못했습니다: ' + S.p.err);
}
async function pReset(){
  const meta = await pMeta();
  if (meta){ const r = await gfetch(`/me/drive/items/${meta.id}`, {method: 'DELETE'}); if (!r.ok && r.status !== 404) throw gErr(r, await r.text()); }
  localStorage.removeItem(LS_PCACHE); pDrop();
}
/* 잠금: 저장(실패하면 이 기기에 암호화 보관) 후 화면 데이터에서 비공개 항목을 모두 지움 */
async function pLock(){
  if (!pOpen() || S.p.locking) return;
  const P = S.p; P.locking = true; clearTimeout(P.timer);
  for (let i = 0; P.saving && i < 100; i++) await new Promise(r => setTimeout(r, 100));
  if (P.dirty){ await pSave(); if (P.dirty) await pCacheSave(); }
  if (S.p !== P) return;
  pDrop(); render();
}
function pDrop(){
  COLLS.forEach(c => { for (const [id, e] of Object.entries(S.db[c])) if (e.priv) delete S.db[c][id]; });
  S.p = {key: null};
  if (S.ui.openTaskId && !S.db.tasks[S.ui.openTaskId]) S.ui.openTaskId = null;
  if (S.ui.cardPop && !S.db.tasks[S.ui.cardPop.id]) S.ui.cardPop = null;
  if (S.modal && !S.modal.locked){ S.modal = null; $('#modal').className = ''; $('#modal').innerHTML = ''; }   // 비공개 내용이 보일 수 있는 창(이력·휴지통 등)도 닫음
  hideMenu();
}
const pTouch = () => { if (pOpen()) S.p.act = Date.now(); };

/* ---------- filters / groups ---------- */
function dueKey(t){
  if (!t.due) return 'none'; const td = today();
  if (t.due < td) return 'late'; if (t.due === td) return 'today'; if (t.due === addDays(td,1)) return 'tomorrow';
  const eow = endOfWeek(td); if (t.due <= eow) return 'week'; if (t.due <= addDays(eow,7)) return 'next'; return 'later';
}
function dueTarget(k){ const td = today(), eow = endOfWeek(td); return {today:td, tomorrow:addDays(td,1), week:eow, next:addDays(eow,7), none:''}[k]; }
function passFilter(t){
  const f = S.ui.filters;
  if (!S.ui.showDone && t.done) return false;
  if (f.text){ const q = f.text.toLowerCase(); if (!((t.title||'').toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q))) return false; }
  const as = (t.assignees||[]).filter(isMember), ls = (t.labels||[]).filter(isLabel);
  if (f.assignees.length && !f.assignees.some(a => a === 'none' ? !as.length : as.includes(a))) return false;
  if (f.labels.length && !f.labels.some(l => l === 'none' ? !ls.length : ls.includes(l))) return false;
  if (f.due.length && !f.due.includes(dueKey(t))) return false;
  if (f.buckets.length && !f.buckets.includes(effBucket(t))) return false;
  return true;
}
const fCount = () => { const f = S.ui.filters; return f.assignees.length + f.labels.length + f.due.length + f.buckets.length; };
/* 미완료 작업은 지정 순서대로, 완료 작업은 맨 아래에 '가장 최근 완료'가 위로 오게 */
const doneCmp = (x,y) => (x.done ? 1 : 0) - (y.done ? 1 : 0) || (x.done && y.done ? (y.doneAt||0) - (x.doneAt||0) : 0);
const byOrder = a => a.slice().sort((x,y) => doneCmp(x,y) || (x.order||0) - (y.order||0));
function getGroups(pid, ts){
  switch (S.ui.groupBy){
    case 'assignee': return [{key:'none', title:'담당자 없음', canAdd:true, tasks: byOrder(ts.filter(t => !(t.assignees||[]).filter(isMember).length))}]
      .concat(members().map(m => ({key:m.id, title:m.name, av:m.id, canAdd:true, tasks: byOrder(ts.filter(t => (t.assignees||[]).includes(m.id)))})));
    case 'labels': return [{key:'none', title:'레이블 없음', canAdd:true, tasks: byOrder(ts.filter(t => !(t.labels||[]).filter(isLabel).length))}]
      .concat(labelsOf(pid).map(l => ({key:l.id, title:l.name, lbl:l, canAdd:true, tasks: byOrder(ts.filter(t => (t.labels||[]).includes(l.id)))})));
    case 'due': return DUE_GROUPS.map(d => ({key:d.k, title:d.t, canAdd:!d.nodrop, nodrop:d.nodrop, tasks: byOrder(ts.filter(t => dueKey(t) === d.k))}));
    default: return buckets(pid).map(b => ({key:b.id, title:b.name, bucket:true, canAdd:true, tasks: byOrder(ts.filter(t => effBucket(t) === b.id))}));
  }
}

}
function contentHtml(){

/* ---------- grid ---------- */
function gridHtml(ts, withPlan){
  const {k, dir} = S.ui.sort;
  const key = t => {
    switch (k){
      case 'title': return t.title || '';
      case 'plan': return S.db.plans[t.planId]?.name || '';
      case 'bucket': { const b = S.db.buckets[effBucket(t)]; return b ? (withPlan ? (S.db.plans[t.planId]?.name||'') + '\u0000' : '') + String(b.order).padStart(12,'0') : ''; }
      case 'assignees': return (t.assignees||[]).filter(isMember).map(memberName).sort().join(',');
      case 'labels': return (t.labels||[]).filter(isLabel).map(id => S.db.labels[id].name).sort().join(',');
      case 'start': return t.start || ''; case 'due': return t.due || '';
      case 'checklist': { const c = t.checklist||[]; return c.length ? String(c.filter(i => i.done).length / c.length) : ''; }
      case 'updated': return String(t.updatedAt || 0).padStart(15,'0');
      case 'done': return t.done ? '1' : '0';
    }
    return '';
  };
  const rows = ts.slice().sort((a,b) => { if (k !== 'done'){ const d = doneCmp(a,b); if (d) return d; } const x = key(a), y = key(b); if (x === y) return (a.order||0) - (b.order||0); if (!x) return 1; if (!y) return -1; return x < y ? -dir : dir; });
  const cols = [['done','완료'], ['title','작업'], ...(withPlan ? [['plan','플랜']] : []), ['bucket','버킷'], ['assignees','담당자'], ['labels','레이블'], ['start','시작일'], ['due','마감일'], ['checklist','체크리스트'], ['updated','최종 수정']];
  if (!rows.length) return `<div class="empty">${withPlan ? '나에게 배정된 작업이 없습니다.' : '표시할 작업이 없습니다.'}</div>`;
  return `<div class="gridwrap"><table class="grid"><thead><tr>${cols.map(([c,t]) => `<th data-act="sort" data-k="${c}">${t}${c === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(t => { const cl = t.checklist||[]; return `<tr class="row" data-task="${t.id}" data-act="task-open" data-id="${t.id}">
      <td style="width:44px">${chkBtn(t)}</td>
      <td class="ttl ${t.done ? 'done-t' : ''}">${esc(t.title)}</td>
      ${withPlan ? `<td>${esc(S.db.plans[t.planId]?.name)}</td>` : ''}
      <td>${esc(S.db.buckets[effBucket(t)]?.name || '')}</td>
      <td><div class="avs">${(t.assignees||[]).filter(isMember).map(id => avatar(id,'sm')).join('')}</div></td>
      <td><div class="lbls" style="margin:0">${(t.labels||[]).filter(isLabel).map(id => lchip(id)).join('')}</div></td>
      <td>${esc(t.start || '')}</td>
      <td class="${dueKey(t) === 'late' && !t.done ? 'late' : ''}">${esc(t.due || '')}</td>
      <td>${cl.length ? `${cl.filter(i => i.done).length}/${cl.length}` : ''}</td>
      <td class="muted">${esc(memberName(t.updatedBy))}<br>${fmtTs(t.updatedAt)}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* 날짜 입력칸: 직접 입력(텍스트) + 📅 달력 선택(숨긴 date 입력의 달력 호출) */
function dateField(t, f){
  const v = esc(t[f] || '');
  return `<span class="dfield"><input type="text" class="dtext" data-chg="t-${f}" data-t="${t.id}" value="${v}" placeholder="예: 11/20" autocomplete="off" title="직접 입력 예: 2026-11-20, 2026.11.20, 11/20, 1120"><button type="button" class="dpick" data-act="dpick" title="달력에서 선택">📅</button><input type="date" class="dhid" data-chg="t-${f}" data-t="${t.id}" value="${v}" tabindex="-1" aria-hidden="true"></span>`;
}
/* 직접 입력한 날짜 해석. 빈 값 → '', 해석 불가 → null */
function parseDateInput(s){
  s = String(s || '').trim(); if (!s) return '';
  s = s.replace(/\s*(년|월)\s*/g, '-').replace(/\s*일\s*$/, '').replace(/[./\s]+/g, '-').replace(/-+$/, '');
  const yr = new Date().getFullYear(); let y, m, d, r;
  if ((r = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [y, m, d] = [r[1], r[2], r[3]];
  else if ((r = s.match(/^(\d{2})-(\d{1,2})-(\d{1,2})$/))) [y, m, d] = ['20' + r[1], r[2], r[3]];
  else if ((r = s.match(/^(\d{4})(\d{2})(\d{2})$/))) [y, m, d] = [r[1], r[2], r[3]];
  else if ((r = s.match(/^(\d{2})(\d{2})(\d{2})$/))) [y, m, d] = ['20' + r[1], r[2], r[3]];
  else if ((r = s.match(/^(\d{1,2})-(\d{1,2})$/))) [y, m, d] = [yr, r[1], r[2]];
  else if ((r = s.match(/^(\d{2})(\d{2})$/))) [y, m, d] = [yr, r[1], r[2]];
  else return null;
  y = Number(y); m = Number(m); d = Number(d);
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return ymd(dt);
}
function setDate(el, f){
  const id = el.dataset.t || S.ui.openTaskId, v = parseDateInput(el.value);
  if (v === null){ el.classList.add('bad'); el.title = '날짜를 인식하지 못했습니다. 예: 2026-11-20, 11/20, 1120'; return; }
  el.classList.remove('bad');
  const box = el.closest('.dfield'); if (box) box.querySelectorAll('input').forEach(i => i.value = v);
  updateTask(id, f, v);
}
/* 담당자·레이블 선택 창 (상세 패널과 카드에서 같은 모양으로 사용) */
function popHtml(t, type){

      ${t.start && t.due && t.start > t.due ? '<div class="warn" style="margin-top:6px;padding:6px 8px">시작일이 마감일보다 늦습니다.</div>' : ''}
      <div style="text-align:right;margin-top:6px"><button class="linkbtn" data-act="date-clear" data-t="${t.id}">날짜 지우기</button></div>`;
  }
  if (type === 'asg'){
    const as = (t.assignees||[]).filter(isMember);
    return members().map(m => `<label class="popi"><input type="checkbox" data-chg="asg" data-t="${t.id}" data-m="${m.id}" ${as.includes(m.id) ? 'checked' : ''}>${avatar(m.id,'sm')}${esc(m.name)}</label>`).join('') || '<div class="muted">구성원이 없습니다.</div>';
  }
  const ls = (t.labels||[]).filter(isLabel), n = labelsOf(t.planId).length;
  return `${labelsOf(t.planId).map(l => `<label class="popi"><input type="checkbox" data-chg="lbl" data-t="${t.id}" data-l="${l.id}" ${ls.includes(l.id) ? 'checked' : ''}>${lchip(l.id)}</label>`).join('') || '<div class="muted" style="padding:4px 6px">아직 레이블이 없습니다.</div>'}
    <div class="popnew"><input class="nl-name" data-key="lbl-new" data-t="${t.id}" placeholder="새 레이블 이름"><select class="nl-color">${LABEL_COLORS.map((c,i) => `<option value="${i}" ${i === n % 25 ? 'selected' : ''}>${c[0]}</option>`).join('')}</select><button class="btn" data-act="lbl-new" data-t="${t.id}">추가</button></div>`;
}
/* 카드에서 연 선택 창: 화면에 떠 있는 창(#cpop)을 누른 버튼 아래에 붙여 표시 */
function renderCardPop(){
  const el = $('#cpop'), cp = S.ui.cardPop, t = cp && S.db.tasks[cp.id];
  const btn = t && !t.deleted && $(`.card[data-id="${cp.id}"] [data-act="card-${cp.type}"]`);
  if (!btn){ S.ui.cardPop = null; el.style.display = 'none'; el.innerHTML = ''; return; }
  const ae = document.activeElement;
  if (!(el.contains(ae) && ae.tagName === 'INPUT' && ae.type !== 'checkbox')) el.innerHTML = popHtml(t, cp.type);
  el.style.display = 'block'; placeCardPop();
}
function placeCardPop(){
  const el = $('#cpop'), cp = S.ui.cardPop; if (!cp) return;
  const btn = $(`.card[data-id="${cp.id}"] [data-act="card-${cp.type}"]`); if (!btn){ el.style.display = 'none'; return; }
  const r = btn.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  el.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
}
function toggleCardPop(id, type){
  const cp = S.ui.cardPop;
  S.ui.cardPop = cp && cp.id === id && cp.type === type ? null : {id, type};
  renderCardPop();
}
function closeCardPop(){ if (!S.ui.cardPop) return; S.ui.cardPop = null; renderCardPop(); }

function refreshModal(force){
  const el = $('#modal'); if (!S.modal) return;
  const ae = document.activeElement;
  if (!force && el.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;

  const mb = el.querySelector('.mb'), st = mb ? mb.scrollTop : 0;

  el.className = 'open'; const nb = el.querySelector('.mb'); if (nb) nb.scrollTop = st;

/* ---------- task operations ---------- */
function newTask(g, title){
  title = (title || '').trim(); if (!title) return;
  const pid = S.ui.planId, gb = S.ui.groupBy;
  let bId = gb === 'bucket' ? g : buckets(pid)[0]?.id;
  if (!bId) bId = create('buckets', {planId:pid, name:'할 일', order:0}).id;
  const minO = Math.min(0, ...tasksOf(pid).map(t => t.order || 0));
  const t = create('tasks', {planId:pid, bucketId:bId, title,
    assignees: gb === 'assignee' && g !== 'none' ? [g] : [], labels: gb === 'labels' && g !== 'none' ? [g] : [],
    start:'', due: gb === 'due' ? dueTarget(g) : '', notes:'', checklist:[], links:[], order: minO - 1, updatedBy:S.user, updatedAt:Date.now()});
  logH(t.id, '생성', '작업', '', title);
}
function dupTask(id){
  const s = S.db.tasks[id]; if (!s) return;
  const t = create('tasks', {planId:s.planId, bucketId:effBucket(s), title: s.title + ' (복사본)', assignees:[...(s.assignees||[])], labels:[...(s.labels||[])], start:s.start||'', due:s.due||'', notes:s.notes||'', checklist:(s.checklist||[]).map(i => ({...i, id:uid()})), links:(s.links||[]).map(l => ({...l, id:uid()})), order:(s.order||0) + 0.001, updatedBy:S.user, updatedAt:Date.now()});
  logH(t.id, '생성', '작업', '', `${t.title} (‘${s.title}’에서 복제)`);
  render();
}
function delTask(id){
  const t = S.db.tasks[id]; if (!t || !confirm(`‘${t.title}’ 작업을 삭제할까요?\n휴지통에서 복원할 수 있습니다.`)) return;
  softDelTask(id, ''); if (S.ui.openTaskId === id) S.ui.openTaskId = null; render();
}
function softDelTask(id, note, byBucket){
  setF('tasks', id, 'deleted', true); setF('tasks', id, 'deletedBy', S.user); setF('tasks', id, 'deletedAt', Date.now()); setF('tasks', id, 'delByBucket', byBucket || ''); touch(id);
  logH(id, '삭제', '작업', S.db.tasks[id].title, note);
}
function undelTask(id, note){
  setF('tasks', id, 'deleted', false); setF('tasks', id, 'delByBucket', ''); touch(id);
  logH(id, '복원', '작업', '', note || S.db.tasks[id].title);
}
function restoreTask(id){
  const t = S.db.tasks[id]; if (!t) return;
  const b = S.db.buckets[t.bucketId];
  if (b && b.deleted && !b.purged && b.planId === t.planId){ restoreBucketOnly(b.id); }   // 버킷이 삭제돼 있으면 버킷도 함께 복원
  undelTask(id);
  if (!effBucket(t)) setF('tasks', id, 'bucketId', create('buckets', {planId:t.planId, name:'할 일', order:0}).id);
  else if (effBucket(t) !== t.bucketId) setF('tasks', id, 'bucketId', effBucket(t));
  render();
}
function restoreBucketOnly(bid){ setF('buckets', bid, 'deleted', false); }
function restoreBucket(bid){
  const b = S.db.buckets[bid]; if (!b) return;
  restoreBucketOnly(bid);
  Object.values(S.db.tasks).filter(t => t.deleted && !t.purged && t.delByBucket === bid).forEach(t => undelTask(t.id, `${t.title} (버킷 ‘${b.name}’ 복원)`));
  render();
}
function toggleDone(id){
  const t = S.db.tasks[id]; if (!t) return; const v = !t.done;
  setF('tasks', id, 'done', v); setF('tasks', id, 'doneAt', v ? Date.now() : 0); setF('tasks', id, 'doneBy', v ? S.user : ''); touch(id);
  logH(id, '완료', '완료 여부', v ? '미완료' : '완료', v ? '완료' : '미완료'); render();
}
/* 휴지통 6개월 경과분 영구 삭제: 내용을 지우고 'purged' 표식만 남김(다른 PC 사본과 병합돼도 되살아나지 않음) */
function purgeOld(){
  const lim = Date.now() - KEEP_MS, old = x => !x.purged && x.deleted && x.deletedAt && x.deletedAt < lim;
  let n = 0, np = 0; const stub = (c, id) => { const t = now(), pv = !!S.db[c][id]?.priv; S.db[c][id] = Object.assign({id, purged:true, deleted:true, _v:{purged:t, deleted:t}}, pv ? {priv:true} : {}); pv ? np++ : n++; };
  const deadPlans = new Set(Object.values(S.db.plans).filter(old).map(p => p.id));
  Object.values(S.db.buckets).forEach(b => { if (!b.purged && (old(b) || deadPlans.has(b.planId))) stub('buckets', b.id); });
  const deadTasks = new Set();
  Object.values(S.db.tasks).forEach(t => { if (!t.purged && (old(t) || deadPlans.has(t.planId))){ deadTasks.add(t.id); stub('tasks', t.id); } });
  Object.values(S.db.labels).forEach(l => { if (!l.purged && (old(l) || deadPlans.has(l.planId))) stub('labels', l.id); });
  Object.values(S.db.history).forEach(h => { if (!h.purged && deadTasks.has(h.taskId)) stub('history', h.id); });
  Object.values(S.db.comments).forEach(c => { if (!c.purged && (old(c) || deadTasks.has(c.taskId))) stub('comments', c.id); });
  deadPlans.forEach(id => stub('plans', id));
  if (n) markDirty();
  if (np) pMarkDirty();
}
function orderBetween(list, beforeId){
  if (!list.length) return 0;
  if (!beforeId) return (list[list.length-1].order || 0) + 1;
  const i = list.findIndex(t => t.id === beforeId); if (i < 0) return (list[list.length-1].order || 0) + 1;
  const next = list[i].order || 0; if (i === 0) return next - 1;
  return ((list[i-1].order || 0) + next) / 2;
}
/* 드래그 대신 쓰는 이동(휴대폰용): 다른 버킷의 맨 위로 / 같은 버킷 안에서 한 칸씩 */
function moveModal(id){
  openModal(() => { const t = S.db.tasks[id]; if (!t) return {title:'이동', body:''}; const cur = effBucket(t);
    return {title:`다른 버킷으로 이동 — ${esc(t.title)}`, body: buckets(t.planId).map(b => `<div class="mrow"><button class="btn ${b.id === cur ? 'on' : ''}" style="flex:1;text-align:left;padding:9px 12px" data-act="move-to" data-id="${id}" data-b="${b.id}">🗂 ${esc(b.name)}${b.id === cur ? ' <span class="muted">(현재)</span>' : ''}</button></div>`).join('')}; });
}
function moveToBucket(id, bid){
  const t = S.db.tasks[id]; if (!t) return;
  if (effBucket(t) !== bid){
    const os = tasksOf(t.planId).filter(x => x.id !== id && effBucket(x) === bid).map(x => x.order || 0);
    updateTask(id, 'order', os.length ? Math.min(...os) - 1 : 0, {noLog:true, noRender:true});
    updateTask(id, 'bucketId', bid, {noRender:true});
  }
  closeModal(); render();
}
/* ---------- 다른 플랜으로 이동 (카드·버킷) ----------
   · 공유 플랜끼리, 비공개 플랜끼리만 이동 가능(공유↔비공개 금지)
   · 카드: 이름이 같은 버킷 → 없으면 첫 번째 버킷의 맨 위
   · 레이블: 같은 이름 레이블에 연결, 없으면 같은 이름·색으로 새로 만듦
   · 버킷: 안의 카드(완료 포함)와 함께 맨 오른쪽으로. 원래 플랜에 버킷이 없어지면 '할 일' 자동 생성 */
function canMovePlan(fromPid, toPid){
  const a = S.db.plans[fromPid], b = S.db.plans[toPid];
  return !!a && !!b && !b.deleted && fromPid !== toPid && !!a.priv === !!b.priv;
}
function mapLabels(ids, toPid){
  const out = [];
  for (const id of ids || []){
    const l = S.db.labels[id]; if (!l || l.deleted) continue;
    if (l.planId === toPid){ out.includes(id) || out.push(id); continue; }
    const same = labelsOf(toPid).find(x => (x.name || '').trim() === (l.name || '').trim());
    const nid = same ? same.id : create('labels', {planId: toPid, name: l.name, color: l.color}).id;
    if (!out.includes(nid)) out.push(nid);
  }
  return out;
}
function moveTaskCore(t, toPid, toBid, order){
  const fromName = S.db.plans[t.planId]?.name || '';
  const ls = mapLabels(t.labels, toPid);
  setF('tasks', t.id, 'planId', toPid); setF('tasks', t.id, 'bucketId', toBid); setF('tasks', t.id, 'order', order);
  if (!same(ls, t.labels || [])) setF('tasks', t.id, 'labels', ls);
  if (S.db.plans[toPid].priv && (t.assignees || []).length) setF('tasks', t.id, 'assignees', []);
  touch(t.id);
  Object.values(S.db.history).forEach(h => { if (h.taskId === t.id && !h.purged && h.planId !== toPid) setF('history', h.id, 'planId', toPid); });   // 이력도 카드를 따라감
  logH(t.id, '이동', '플랜', fromName, S.db.plans[toPid].name);
}
function moveTaskToPlan(id, toPid){
  const t = S.db.tasks[id]; if (!t || t.deleted || !canMovePlan(t.planId, toPid)) return false;
  const to = S.db.plans[toPid], srcB = S.db.buckets[effBucket(t)];
  if (!confirm(`‘${t.title}’ 작업을 ‘${to.name}’ 플랜으로 옮길까요?`)) return false;
  let b = buckets(toPid).find(x => srcB && (x.name || '').trim() === (srcB.name || '').trim()) || buckets(toPid)[0];
  if (!b) b = create('buckets', {planId: toPid, name: '할 일', order: 0});
  const os = tasksOf(toPid).filter(x => effBucket(x) === b.id).map(x => x.order || 0);
  moveTaskCore(t, toPid, b.id, os.length ? Math.min(...os) - 1 : 0);
  if (S.ui.openTaskId === id) S.ui.openTaskId = null;
  closeModal(); render(); return true;
}
function moveBucketToPlan(bid, toPid){
  const b = S.db.buckets[bid]; if (!b || b.deleted || !canMovePlan(b.planId, toPid)) return false;
  const fromPid = b.planId, to = S.db.plans[toPid];
  const ts = tasksOf(fromPid).filter(t => effBucket(t) === bid);
  if (!confirm(`‘${b.name}’ 버킷을 ‘${to.name}’ 플랜으로 옮길까요?${ts.length ? `\n버킷 안의 작업 ${ts.length}개(완료 포함)도 함께 옮겨집니다.` : ''}`)) return false;
  const bs = buckets(toPid);
  setF('buckets', bid, 'planId', toPid); setF('buckets', bid, 'order', bs.length ? (bs[bs.length-1].order || 0) + 1 : 0);
  ts.forEach(t => moveTaskCore(t, toPid, bid, t.order || 0));
  if (!buckets(fromPid).length) create('buckets', {planId: fromPid, name: '할 일', order: 0});
  if (S.ui.openTaskId && ts.some(t => t.id === S.ui.openTaskId)) S.ui.openTaskId = null;
  closeModal(); render(); return true;
}
function planMoveModal(kind, id){
  const src = kind === 'task' ? S.db.tasks[id] : S.db.buckets[id]; if (!src) return;
  openModal(() => {
    const list = plans().filter(p => canMovePlan(src.planId, p.id));
    return {title: `다른 플랜으로 이동 — ${esc(kind === 'task' ? src.title : src.name)}`, body: (list.length
      ? list.map(p => `<div class="mrow"><button class="btn" style="flex:1;text-align:left;display:flex;align-items:center;gap:8px;padding:8px 12px" data-act="plan-move-to" data-k="${kind}" data-id="${id}" data-p="${p.id}">${planDot(p)}${esc(p.name)}</button></div>`).join('')
      : '<div class="muted">옮길 수 있는 플랜이 없습니다.</div>')
      + `<div class="muted" style="margin-top:8px">${S.db.plans[src.planId]?.priv ? '비공개 플랜끼리만 옮길 수 있습니다.' : '공유 플랜끼리만 옮길 수 있습니다. 비공개 플랜으로는 옮길 수 없습니다.'}</div>`};
  });
}
function nudgeTask(id, d){
  const t = S.db.tasks[id]; if (!t) return;
  const list = byOrder(tasksOf(t.planId).filter(x => effBucket(x) === effBucket(t) && !!x.done === !!t.done && passFilter(x)));
  const i = list.findIndex(x => x.id === id), j = i + d; if (i < 0 || j < 0 || j >= list.length) return;
  const a = list[j].order || 0, b = list[j + d] ? (list[j + d].order || 0) : a + d;
  updateTask(id, 'order', a === b ? a + d * 0.5 : (a + b) / 2, {noLog:true});
}
function dropTask(id, from, to, beforeId){
  const t = S.db.tasks[id]; if (!t) return;
  const gb = S.ui.groupBy, ts = tasksOf(S.ui.planId).filter(passFilter);
  const grp = getGroups(S.ui.planId, ts).find(g => g.key === to); if (!grp || grp.nodrop) return;
  const list = grp.tasks.filter(x => x.id !== id);
  updateTask(id, 'order', orderBetween(list, beforeId), {noLog:true, noRender:true});
  if (gb === 'bucket') updateTask(id, 'bucketId', to, {noRender:true});
  else if (gb === 'assignee' || gb === 'labels'){
    const f = gb === 'assignee' ? 'assignees' : 'labels'; let arr = [...(t[f] || [])];
    if (from !== to){ if (from !== 'none') arr = arr.filter(x => x !== from); if (to !== 'none' && !arr.includes(to)) arr.push(to); if (to === 'none' && from === 'none') arr = []; }
    updateTask(id, f, arr, {noRender:true});
  } else if (gb === 'due' && from !== to) updateTask(id, 'due', dueTarget(to), {noRender:true});
  render();
}
