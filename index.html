  if (mi){ const it = S.menuItems[Number(mi.dataset.mi)]; hideMenu(); it?.fn?.(); return; }
  hideMenu();
  if (document.body.classList.contains('navopen') && (!e.target.closest('#nav') || e.target.closest('#nav .nav-item')) && !e.target.closest('[data-act="nav-toggle"]')) document.body.classList.remove('navopen');
  if (e.target.id === 'modal'){ closeModal(); return; }
  // 상세 패널 바깥(다른 카드·행 제외)을 누르면 패널 닫기
  if (S.ui.cardPop && !e.target.closest('#cpop') && !e.target.closest('[data-act="card-asg"],[data-act="card-lbl"],[data-act="card-date"]')) closeCardPop();
  if (S.ui.openTaskId && !e.target.closest('#panel,#ctx,#modal,#cpop,[data-task]')){
    S.ui.openTaskId = null; S.ui.pop = null; renderPanel(); $$('.card.sel').forEach(c => c.classList.remove('sel'));
  }
  if (S.ui.pop && !e.target.closest('.pop') && !e.target.closest('[data-act="pop"]')){ S.ui.pop = null; if (!e.target.closest('[data-act]')) renderPanel(); }
  if (S.ui.fltOpen && !e.target.closest('.fpanel') && !e.target.closest('[data-act="filter"]')){ S.ui.fltOpen = false; render(); return; }
  if (S.ui.addingIn && !e.target.closest('.newtask') && !e.target.closest('[data-act="add-task"]')) S.ui.addingIn = null;
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]){ if (el.tagName === 'A') e.preventDefault(); ACT[el.dataset.act](el, e); }
});
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-task]'); if (!el || e.target.closest('#panel input,#panel textarea')) return;
  e.preventDefault(); taskMenu(el.dataset.task, e.clientX, e.clientY);
});

/* ---------- events: change / input / key ---------- */
const CHG = {
  'groupby': el => { S.ui.groupBy = el.value; S.ui.addingIn = null; render(); },
  'flt': el => { const a = S.ui.filters[el.dataset.k]; const i = a.indexOf(el.value); if (el.checked && i < 0) a.push(el.value); if (!el.checked && i >= 0) a.splice(i,1); render(); },
  't-title': el => { const v = el.value.trim(); if (!v){ el.value = S.db.tasks[S.ui.openTaskId].title; return; } updateTask(S.ui.openTaskId, 'title', v); },
  't-bucket': el => updateTask(S.ui.openTaskId, 'bucketId', el.value),
  't-start': el => setDate(el, 'start'),
  't-due': el => setDate(el, 'due'),
  't-notes': el => updateTask(S.ui.openTaskId, 'notes', el.value),
  'asg': el => { const t = S.db.tasks[el.dataset.t || S.ui.openTaskId]; if (!t || t.priv) return; let a = (t.assignees||[]).filter(x => x !== el.dataset.m); if (el.checked) a.push(el.dataset.m); updateTask(t.id, 'assignees', a); },
  'lbl': el => { const t = S.db.tasks[el.dataset.t || S.ui.openTaskId]; let a = (t.labels||[]).filter(x => x !== el.dataset.l); if (el.checked) a.push(el.dataset.l); updateTask(t.id, 'labels', a); },
  'cl-done': el => { const t = S.db.tasks[S.ui.openTaskId], cl = (t.checklist||[]).map(i => i.id === el.dataset.i ? {...i, done: el.checked} : i), it = cl.find(i => i.id === el.dataset.i);
    updateTask(t.id, 'checklist', cl, {noLog:true, noRender:true}); logH(t.id, '수정', `체크리스트: ${it.text}`, el.checked ? '미완료' : '완료', el.checked ? '완료' : '미완료'); render(); },
  'cl-text': el => { const t = S.db.tasks[S.ui.openTaskId], old = (t.checklist||[]).find(i => i.id === el.dataset.i), v = el.value.trim(); if (!v || !old || v === old.text) return;
    updateTask(t.id, 'checklist', t.checklist.map(i => i.id === el.dataset.i ? {...i, text:v} : i), {noLog:true, noRender:true}); logH(t.id, '수정', '체크리스트 항목', old.text, v); render(); },
  'mem-name': el => { const v = el.value.trim(); if (v && v !== S.db.members[el.dataset.id].name){ setF('members', el.dataset.id, 'name', v); render(); } },
  'lbl-name': el => { const v = el.value.trim(); if (v && v !== S.db.labels[el.dataset.id].name){ setF('labels', el.dataset.id, 'name', v); render(); } },
  'lbl-color': el => { setF('labels', el.dataset.id, 'color', Number(el.value)); render(); refreshModal(true); }
};
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e => { if (e.target.dataset.inp === 'search'){ S.ui.filters.text = e.target.value; renderContent(); } });
document.addEventListener('keydown', e => {
  const k = e.target.dataset?.key;
  if (k && e.key === 'Enter' && !e.isComposing){
    e.preventDefault();
    if (k === 'newtask'){ newTask(e.target.dataset.g, e.target.value); render(); }
    else if (k === 'newbucket') addBucket(e.target.value);
    else if (k === 'cl-add'){ const v = e.target.value.trim(); if (!v) return; const t = S.db.tasks[S.ui.openTaskId]; e.target.value = ''; e.target.blur();
      updateTask(t.id, 'checklist', [...(t.checklist||[]), {id:uid(), text:v, done:false}], {noLog:true, noRender:true}); logH(t.id, '수정', '체크리스트', '', `항목 추가: ${v}`); render(); $('[data-key="cl-add"]')?.focus(); }
    else if (k === 'lbl-new') ACT['lbl-new'](e.target);
    else if (k === 'mem-add') ACT['mem-add']();
    else if (k === 'lm-add') ACT['lm-add']();
    else if (k === 'user-new') ACT['user-new']();
    else if (k === 'gf-in') ACT['gf-connect']();
    else if (k === 'acct-new') ACT['acct-new']();
    else if (k === 'pw-unlock' || k === 'pw-create' || k === 'pw-change') ACT[k]();
    return;
  }
  if (k && e.key === 'Escape'){ if (k === 'newtask'){ S.ui.addingIn = null; render(); } if (k === 'newbucket'){ S.ui.addingBucket = false; render(); } return; }
  if (e.target.id === 'cmt-in' && e.key === 'Enter' && e.ctrlKey){ ACT['cmt-add'](); return; }
  if (e.key === 'Escape'){
    if ($('#ctx').style.display === 'block'){ hideMenu(); return; }
    if (S.modal){ closeModal(); return; }
    if (S.ui.cardPop){ closeCardPop(); return; }
    if (S.ui.pop){ S.ui.pop = null; renderPanel(); return; }
    if (S.ui.fltOpen){ S.ui.fltOpen = false; render(); return; }
    if (S.ui.openTaskId && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){ S.ui.openTaskId = null; render(); }
  }
});
$('#panel').addEventListener('focusout', () => setTimeout(() => { const ae = document.activeElement; if (S.panelPending && !($('#panel').contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) renderPanel(); }, 0));

/* ---------- drag & drop ---------- */
function clearDrop(){ $$('.dropph').forEach(x => x.remove()); $$('.over,.bover,.bover-r').forEach(x => x.classList.remove('over','bover','bover-r')); }
function afterCard(list, y){
  const cards = Array.from(list.querySelectorAll('.card:not(.dragging)'));
  return cards.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
}
document.addEventListener('scroll', () => placeCardPop(), true);
window.addEventListener('resize', () => placeCardPop());
document.addEventListener('dragstart', e => {
  closeCardPop();
  const c = e.target.closest?.('[data-drag-task]');
  if (c){ S.drag = {type:'task', id:c.dataset.dragTask, from:c.dataset.g || ''}; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', c.dataset.dragTask); setTimeout(() => c.classList.add('dragging'), 0); hideMenu(); return; }
  const b = e.target.closest?.('[data-drag-bucket]');
  if (b){ S.drag = {type:'bucket', id:b.dataset.dragBucket}; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'bucket'); }
});
document.addEventListener('dragover', e => {
  if (!S.drag) return;
  const np = e.target.closest('[data-drop="plan"]');
  if (np){                                            // 왼쪽 메뉴의 플랜 위: 다른 플랜으로 이동
    clearDrop();
    const src = S.drag.type === 'task' ? S.db.tasks[S.drag.id] : S.db.buckets[S.drag.id];
    if (!src || !canMovePlan(src.planId, np.dataset.pid)){ e.dataTransfer.dropEffect = 'none'; return; }
    e.preventDefault(); e.dataTransfer.dropEffect = 'move'; np.classList.add('over'); return;
  }
  if (S.drag.type === 'task'){
    const z = e.target.closest('[data-drop]'); clearDrop();
    if (!z || z.dataset.nodrop){ e.dataTransfer.dropEffect = 'none'; return; }
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    if (z.dataset.drop === 'col'){ const list = z.querySelector('.cards'), a = afterCard(list, e.clientY), ph = document.createElement('div'); ph.className = 'dropph'; a ? list.insertBefore(ph, a) : list.appendChild(ph); }
    else z.classList.add('over');
  } else {
    const col = e.target.closest('.col[data-bucket]'); clearDrop(); if (!col || col.dataset.bucket === S.drag.id) return;
    e.preventDefault(); const r = col.getBoundingClientRect(); col.classList.add(e.clientX < r.left + r.width / 2 ? 'bover' : 'bover-r');
  }
});
document.addEventListener('drop', e => {
  if (!S.drag) return; e.preventDefault();
  const d = S.drag;
  const np = e.target.closest('[data-drop="plan"]');
  if (np){
    S.drag = null; clearDrop(); $$('.dragging').forEach(x => x.classList.remove('dragging'));
    d.type === 'task' ? moveTaskToPlan(d.id, np.dataset.pid) : moveBucketToPlan(d.id, np.dataset.pid);
    return;
  }
  if (d.type === 'task'){
    const z = e.target.closest('[data-drop]');
    if (z && !z.dataset.nodrop){
      if (z.dataset.drop === 'col'){
        const ph = z.querySelector('.dropph'); let nx = ph?.nextElementSibling;
        while (nx && (!nx.classList.contains('card') || nx.dataset.dragTask === d.id)) nx = nx.nextElementSibling;
        S.drag = null; clearDrop(); dropTask(d.id, d.from, z.dataset.g, nx ? nx.dataset.dragTask : null);
      } else { S.drag = null; clearDrop(); updateTask(d.id, 'due', z.dataset.date); }
    }
  } else {
    const col = e.target.closest('.col[data-bucket]');
    if (col && col.dataset.bucket !== d.id){
      const r = col.getBoundingClientRect(), before = e.clientX < r.left + r.width / 2;
      const bs = buckets(S.ui.planId).filter(b => b.id !== d.id), i = bs.findIndex(b => b.id === col.dataset.bucket);
      const pos = before ? i : i + 1, prev = bs[pos-1], next = bs[pos];
      const o = prev && next ? ((prev.order||0) + (next.order||0)) / 2 : prev ? (prev.order||0) + 1 : next ? (next.order||0) - 1 : 0;
      S.drag = null; clearDrop(); setF('buckets', d.id, 'order', o); render();
    }
  }
  S.drag = null; clearDrop();
});
document.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); clearDrop(); const pend = S.renderPending; S.drag = null; S.renderPending = false; if (pend) render(); });

/* ---------- boot ---------- */
window.addEventListener('beforeunload', e => { gCacheSave(); if (S.p.dirty || S.p.saving){ pSave(); e.preventDefault(); e.returnValue = ''; } if (S.dirty || S.saving){ saveNow(); e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('pagehide', () => gCacheSave());
window.addEventListener('focus', () => poll(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(true); else gCacheSave(); });
setInterval(poll, 4000);
setInterval(() => { if (S.mode && S.ui.view !== 'grid' && !S.drag && document.visibilityState === 'visible'){ const td = today(); if (S._td && S._td !== td){ purgeOld(); render(); } S._td = td; } }, 60000);
(async function boot(){
  if (msReady()){
    try { const r = await msHandleRedirect(); if (r?.err){ S.gErr = r.silent ? '로그인이 만료되었습니다. 다시 로그인해 주세요.' : '로그인하지 못했습니다: ' + r.err; localStorage.removeItem(LS_TOK); } }
    catch(e){ S.gErr = '로그인하지 못했습니다: ' + (e.message || e); }
    const f = gFolder();
    if (msTok() && f && !S.gErr){
      S.gBusy = true; render();
      try { await gConnect(f); S.gBusy = false; return; }
      catch(e){
        S.gBusy = false;
        if (e.auth && !sessionStorage.getItem(SS_SILENT)){ sessionStorage.setItem(SS_SILENT, '1'); msLogin(true); return; }   // 하루 지나 만료되면 자동으로 조용히 재로그인
        S.gErr = e.auth ? '로그인이 만료되었습니다. 다시 로그인해 주세요.' : '폴더에 연결하지 못했습니다: ' + (e.message || e);
        if (e.auth) localStorage.removeItem(LS_TOK);
      }
    }
    if (msTok() || S.gErr){ render(); return; }
  }
  if ('showDirectoryPicker' in window){
    const dir = await idbGet('dir');
    if (dir){ S.savedDir = dir; try { if ((await dir.queryPermission({mode:'readwrite'})) === 'granted'){ await connectDir(dir); return; } } catch(e){} }
  }
  render();
})();
</script>
</body>
</html>
